# Scala Steward configuration.
#
# THIS IS THE FILE STEWARD ACTUALLY READS. `.github/.scala-steward.conf` is not applied — see the
# stub there for the evidence — so every rule must live here. Splitting policy across the two files
# is what made the BouncyCastle grouping rule below silently inert for a month.

# sbt has NO pin. There used to be one here holding sbt to prefix "1.", with a comment saying we had
# "NOT adopted sbt 2.0" — but the build moved to sbt 2.0.0 and the pin was never updated. Because
# "1." is a PREFIX pattern it then filtered out every 2.0.x release, so 2.0.1 through 2.0.9 were
# never proposed. The same quiet-failure shape as the BouncyCastle grouping rule below: a rule that
# looks active, is not, and says nothing. project/build.properties is the single source of truth for
# the sbt version.
#
# NO PIN MEANS NO PIN: Steward will propose sbt MINOR and MAJOR bumps (2.1.x, 3.0.0) as well as
# patches. That is deliberate — a "2." prefix pin would be a fourth rule in this file quietly
# filtering releases nobody remembers pinning — the exact failure PRs #139 and #140 were cleaning
# up. The constraint is real but belongs in review, not in a silent filter.
#
# ONE pre-GA dependency gates an sbt bump past a 2.0.x patch: sbt-protoc, still an RC on sbt 2
# (project/plugins.sbt pins 1.1.0-RC2, the newest _sbt2_3 artifact). Treat such a bump as a
# MANUAL-REVIEW PR and check sbt-protoc first; the other two plugins actually on the metabuild,
# sbt-scalajs and sbt-scala-native, resolve as _sbt2_3 and are what an sbt-series bump exercises.
# sbt-native-packager is NOT a gate — it is not in project/plugins.sbt at all. Its missing sbt 2
# build is already worked around by hand-staging (build.sbt:103, build.sbt:310,
# deploy/grpc-web/README.md); that is a workaround to RETIRE when it ships, not a blocker.

# Block BouncyCastle 1.86. bctls-jdk18on 1.86 ships a broken multi-release JAR: its
# META-INF/versions/9/ overlay was pruned from 461 entries to 29, but SSLEngineUtil.class was left
# in while its caller ProvSSLContextSpi.class was dropped. The two disagree on the return type of
# `create(ContextData)` — ProvSSLEngine in the overlay, javax.net.ssl.SSLEngine in the base — and
# return type is part of the JVM method descriptor, so on any JDK 9+ every
# SSLContext.createSSLEngine() through BouncyCastleJsseProvider dies with NoSuchMethodError. That
# takes out TlsRoundServerSpec and, with it, PqTls (see transport/.../PqTls.scala — bctls is what
# supplies the RFC 10024 hybrid group, so we cannot just drop it). Upstream packaging bug, not ours.
#
# All four BC artifacts share one V.bouncycastle key, so ignoring bctls alone would not help: the
# grouped PR would still set the key to 1.86. Hence groupId-wide (artifactId omitted matches every
# artifact in the group).
#
# `exact` is deliberate. A bare `version = "1.86"` is a PREFIX pattern (VersionPattern decodes a
# plain string as prefix), which would also block 1.86.1 — the fixed release we are waiting for.
# With `exact`, the moment BC publishes 1.86.1 Steward proposes it and this rule can be deleted.
#
# REMOVAL TRIGGER: delete this entry when BouncyCastle publishes 1.86.1 (or any later release whose
# bctls jar has a consistent versions/9 overlay). Tracked upstream as bcgit/bc-java#2448, reported
# 2026-09-15 by a third party who hit the same defect independently and attached a framework-free
# reproducer; watch that issue for the fix release. Our own diagnosis is in the closing comment on
# PR #137.
#
# COLLATERAL HOLD — READ BEFORE IGNORING A BC ADVISORY. The defect is in bctls ONLY, but because the
# four artifacts share one version key this rule holds bcprov, bcpkix and bcutil at 1.85 too. Those
# are on the TLS/crypto path (build.sbt:352-355) and bcprov is also the KAT cross-validation
# dependency (build.sbt:244). So if 1.86 carries a SECURITY fix for bcprov/bcpkix/bcutil, this rule
# will suppress it silently. In that case do not just wait: split V.bouncycastle so bctls can stay
# at 1.85 while the others move, or take 1.86 everywhere and pin bctls back by itself.
#
# SECOND ENTRY, different defect, same shared-key cause. bcprov publishes releases the other three do
# not — 1.85.2 exists for bcprov while bcpkix, bctls and bcutil stop at 1.85. Steward sees that as an
# ordinary bcprov update, rewrites the single V.bouncycastle literal to 1.85.2, and the build no
# longer resolves bcpkix. Grouping does NOT prevent this (see the grouping block below).
#
# The pattern is a PREFIX ("1.85." matches 1.85.2, 1.85.3, ... but not 1.85 itself and not 1.86.x),
# deliberately broader than the one release seen so far: the defect is structural, so pinning to
# `exact = "1.85.2"` would leave the next bcprov-only patch to be rediscovered by a red CI run.
#
# REMOVAL TRIGGER: delete when bcpkix/bctls/bcutil catch up to the same patch level, or when
# V.bouncycastle is split into per-artifact keys — after either, this entry holds bcprov back for no
# reason. ESCALATION: a THIRD ignore entry for this cause is the wrong answer; split the key instead.
# Not split already because the four BC artifacts are meant to move in lockstep, and a mixed-version
# BC stack on the TLS path is its own risk — that is a deliberate call, not an oversight.
#
# COLLATERAL HOLD APPLIES HERE TOO. A bcprov-only patch is the usual shape of a targeted provider
# security fix, and this entry suppresses the whole 1.85.x line silently. What 1.85.2 actually
# contains was NOT verified when this rule was written — do not assume it is routine. If any 1.85.x
# bcprov release turns out to carry a security fix, do not sit on this ignore: split V.bouncycastle
# so bcprov can move alone, the same remedy the 1.86 block names.
updates.ignore = [
  { groupId = "org.bouncycastle", version = { exact = "1.86" } },
  { groupId = "org.bouncycastle", artifactId = "bcprov-jdk18on", version = { prefix = "1.85." } }
]

# Consolidate BouncyCastle updates into ONE pull request. Read what this does and does not do:
# grouping merges updates Steward has ALREADY decided to propose into a single PR. It cannot
# constrain which version is proposed, and a group of one is still a PR. So it does NOT prevent the
# unbuildable bcprov-only bump described above — the updates.ignore entry for the 1.85.x line does
# that, and CI (compile failure, then TlsRoundServerSpec) is the only real gate. What this rule buys
# is narrower still: a stable, greppable PR TITLE. Steward's built-in grouping already collapses the
# four into one PR whenever they share a current and a candidate version, which is the only case
# this rule applies to — PR #137 was exactly that, one PR for all four with no rule in force.
#
# This rule previously lived in .github/.scala-steward.conf and therefore never ran. Proof: PR #137
# (2026-09-14, a month after that file landed) was titled "Update bcpkix-jdk18on, bcprov-jdk18on,
# ... to 1.86" — Steward's default multi-artifact title — not the `title` configured here.
pullRequests.grouping = [
  { name = "bouncycastle", title = "build(deps): BouncyCastle updates", filter = [{ group = "org.bouncycastle" }] }
]

# Scala tracks the latest stable release, not the 3.3.x LTS line (see `build.sbt` for the version in
# force). There is deliberately no org.scala-lang pin, so each new stable Scala 3 release is
# proposed as it lands; pre-releases are excluded while the current version is stable, which is why
# Steward offered 3.9.0 rather than the then-current 3.10.0-RC2.
#
# A SCALA BUMP IS NOT MERGEABLE ON STEWARD'S SCHEDULE ALONE. Scala Native's compiler plugin is
# published per EXACT Scala version: `nscplugin_<scalaVersion>` for a given sbt-scala-native release
# (project/plugins.sbt pins 0.5.12, which published nscplugin_3.9.0). Until scala-native ships a
# release covering a new Scala version, that version's PR CANNOT link — the dedicated Native job
# (.github/workflows/ci.yml, `testNative`) fails on an unresolvable nscplugin and Steward re-proposes
# it every Monday. That job is the gate; check
# repo1.maven.org/maven2/org/scala-native/nscplugin_<version>/ before merging a Scala bump. If the
# weekly red PR becomes noise, add a temporary updates.ignore for that Scala version and retarget it
# once scala-native catches up.
