# Scala Steward configuration.
#
# THIS IS THE FILE STEWARD ACTUALLY READS. `.github/.scala-steward.conf` is not applied — see the
# stub there for the evidence — so every rule must live here. Splitting policy across the two files
# is what made the BouncyCastle grouping rule below silently inert for a month.

# Keep sbt on the 1.x line. We intentionally pin to 1.10.x and have NOT adopted sbt 2.0 (its plugin
# ecosystem — sbt-protoc/ScalaPB, Scala.js — is still stabilizing). Remove this pin to let Steward
# propose sbt 2.x updates.
updates.pin = [
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." }
]

# Block BouncyCastle 1.86. bctls-jdk18on 1.86 ships a broken multi-release JAR: its
# META-INF/versions/9/ overlay was pruned from 461 entries to 29, but SSLEngineUtil.class was left
# in while its caller ProvSSLContextSpi.class was dropped. The two disagree on the return type of
# `create(ContextData)` — ProvSSLEngine in the overlay, javax.net.ssl.SSLEngine in the base — and
# return type is part of the JVM method descriptor, so on any JDK 9+ every
# SSLContext.createSSLEngine() through BouncyCastleJsseProvider dies with NoSuchMethodError. That
# takes out TlsRoundServerSpec and, with it, PqTls (see transport/.../PqTls.scala — bctls is what
# supplies the RFC 10024 hybrid group, so we cannot just drop it). Upstream packaging bug, not ours.
#
# All four BC artifacts share one V.bouncycastle key, so ignoring bctls alone would not help: the
# grouped PR would still set the key to 1.86. Hence groupId-wide (artifactId omitted matches every
# artifact in the group).
#
# `exact` is deliberate. A bare `version = "1.86"` is a PREFIX pattern (VersionPattern decodes a
# plain string as prefix), which would also block 1.86.1 — the fixed release we are waiting for.
# With `exact`, the moment BC publishes 1.86.1 Steward proposes it and this rule can be deleted.
#
# REMOVAL TRIGGER: delete this entry when BouncyCastle publishes 1.86.1 (or any later release whose
# bctls jar has a consistent versions/9 overlay). Context and the full diagnosis are in the closing
# comment on PR #137; there is no upstream issue link here because none was filed by us — verify
# against github.com/bcgit/bc-java before assuming the defect is known upstream.
#
# COLLATERAL HOLD — READ BEFORE IGNORING A BC ADVISORY. The defect is in bctls ONLY, but because the
# four artifacts share one version key this rule holds bcprov, bcpkix and bcutil at 1.85 too. Those
# are on the TLS/crypto path (build.sbt:352-355) and bcprov is also the KAT cross-validation
# dependency (build.sbt:244). So if 1.86 carries a SECURITY fix for bcprov/bcpkix/bcutil, this rule
# will suppress it silently. In that case do not just wait: split V.bouncycastle so bctls can stay
# at 1.85 while the others move, or take 1.86 everywhere and pin bctls back by itself.
updates.ignore = [
  { groupId = "org.bouncycastle", version = { exact = "1.86" } }
]

# Force the BouncyCastle artifacts into ONE pull request. They do not version in lockstep upstream —
# bcprov ships patch releases the others do not (1.85.2 exists for bcprov today; bcpkix, bctls and
# bcutil all stop at 1.85) — but they share a single V.bouncycastle key, so they MUST move together.
# Ungrouped, Steward opened two conflicting PRs and the bcprov-only one was unbuildable: it set
# V.bouncycastle = 1.85.2, a version bcpkix cannot resolve. Grouping forces one PR at a version
# every artifact actually publishes.
#
# This rule previously lived in .github/.scala-steward.conf and therefore never ran. Proof: PR #137
# (2026-09-14, a month after that file landed) was titled "Update bcpkix-jdk18on, bcprov-jdk18on,
# ... to 1.86" — Steward's default multi-artifact title — not the `title` configured here.
pullRequests.grouping = [
  { name = "bouncycastle", title = "build(deps): BouncyCastle updates", filter = [{ group = "org.bouncycastle" }] }
]

# Scala tracks the latest stable release, not the 3.3.x LTS line (see `build.sbt` for the version in
# force). There is deliberately no org.scala-lang pin, so each new stable Scala 3 release is
# proposed as it lands; pre-releases are excluded while the current version is stable, which is why
# Steward offered 3.9.0 rather than the then-current 3.10.0-RC2.
#
# A SCALA BUMP IS NOT MERGEABLE ON STEWARD'S SCHEDULE ALONE. Scala Native's compiler plugin is
# published per EXACT Scala version: `nscplugin_<scalaVersion>` for a given sbt-scala-native release
# (project/plugins.sbt pins 0.5.12, which published nscplugin_3.9.0). Until scala-native ships a
# release covering a new Scala version, that version's PR CANNOT link — the dedicated Native job
# (.github/workflows/ci.yml, `testNative`) fails on an unresolvable nscplugin and Steward re-proposes
# it every Monday. That job is the gate; check
# repo1.maven.org/maven2/org/scala-native/nscplugin_<version>/ before merging a Scala bump. If the
# weekly red PR becomes noise, add a temporary updates.ignore for that Scala version and retarget it
# once scala-native catches up.
