name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM — sbt test + labeling gate
    runs-on: ubuntu-latest
    env:
      # Cross-stack PQ TLS interop must actually run here, not cancel. See PqTlsInteropSpec.
      REQUIRE_PQ_INTEROP: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install libsodium (crypto FFM tests)
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: Build liboqs shared (post-quantum FFM tests — FIPS 203/204)
        run: |
          # liboqs isn't in apt; build the shared lib from the vetted OQS source. Pinned by COMMIT SHA
          # (the 0.15.0 tag's commit) rather than the mutable tag — Constitution XI. BUILD_ONLY_LIB
          # keeps it to just the library.
          sudo apt-get install -y cmake ninja-build libssl-dev
          LIBOQS_SHA=97f6b86b1b6d109cfd43cf276ae39c2e776aed80 # tag 0.15.0
          git init liboqs
          git -C liboqs fetch --depth 1 https://github.com/open-quantum-safe/liboqs "$LIBOQS_SHA"
          git -C liboqs checkout FETCH_HEAD
          cmake -S liboqs -B liboqs/build -GNinja -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON
          cmake --build liboqs/build --parallel
          sudo cmake --install liboqs/build
          sudo ldconfig
          echo "OQS_PATH=/usr/local/lib/liboqs.so" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "24" # Foreign Function & Memory API is final since 22
      - uses: sbt/setup-sbt@v1
      # Go is the independent TLS stack that PqTlsInteropSpec drives against the hybrid-only PQ bind
      # (transport). Its crypto/tls has had X25519MLKEM768 on by default since 1.24. Pinned like
      # every other toolchain here (Constitution XI) rather than relying on whatever the runner image
      # happens to preinstall — and REQUIRE_PQ_INTEROP below turns "Go missing" from a silent skip
      # into a failure, because a permanently-cancelled test reads exactly like a passing one.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
      # No Node here: the JS engine tests run in the `scalajs` job, so this job stays JVM-only.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', 'project/V.scala') }}
          restore-keys: sbt-${{ runner.os }}-
      - name: Test the JVM modules + labeling gate (T008) in one sbt session
        run: |
          set -o pipefail
          # One sbt session (`;`-chained) avoids a second cold JVM/project-load. `;` aborts on the
          # first failing command, so a test failure fails the step before the gate runs. `testJvm`
          # (defined in build.sbt next to the aggregate) runs the JVM modules; the JS module is
          # covered by the scalajs job, so it is intentionally not run here.
          sbt -batch -no-colors ';testJvm ;protocolCore/runMain cli.Pstatus show' 2>&1 | tee /tmp/sbt.out
          # Labeling gate: a build without the real backend MUST report no metadata privacy. sbt 2.0's
          # `export fullClasspath` yields virtual ${OUT} paths (not a usable -cp), so we read the CLI's
          # JSON from the session log — but isolate the one line that is `cli.Pstatus`'s actual output
          # (it carries BOTH "backend" and "metadataPrivate") so incidental test stdout can't satisfy
          # the gate. Fail-closed: a missing/regressed line fails the step.
          gate="$(grep '"metadataPrivate"' /tmp/sbt.out | grep '"backend"' | tail -1)"
          echo "pstatus -> $gate"
          echo "$gate" | grep -q '"metadataPrivate":false' \
            && echo "$gate" | grep -q 'DEV, NO METADATA PRIVACY' \
            || { echo "::error::labeling gate failed — a dev build must report no metadata privacy (Constitution IV)"; exit 1; }

      # The staged CLIs carry a JEP 483 AOT cache (see the block in build.sbt). This step exists
      # because the cache's failure mode is SILENT: a missing/stale/JDK-mismatched cache makes the
      # JVM print `[error][aot] ...` lines ON STDOUT and still exit 0, which would corrupt the JSON
      # contract above without failing anything. So we assert stdout purity directly, on the same
      # JDK 24 CI actually ships — the measurements in build.sbt were taken on JDK 26.
      - name: Staged CLI + AOT cache — stdout stays pure JSON
        run: |
          set -o pipefail
          sbt -batch -no-colors 'protocolCore/stageCli' 2>&1 | tee /tmp/stage.out
          # Match the staged dir by its EXACT parent (`<module>/cli`), not by a loose `*protocol-core*`
          # substring: `cli` is also the package name, so every compiled output tree carries a `cli/`
          # (classes/cli, test-classes/cli, and the same again per Scala version and for the JS build).
          # A `find | head -1` over those picks whichever entry the filesystem happens to return first,
          # which is directory order, not sorted — so it selected the right one by luck and later
          # failed with the caches sitting on disk. Assert exactly one match, like the scalajs job's
          # bundle glob does, so an ambiguous layout fails loudly instead of silently choosing wrong.
          mapfile -t clis < <(find target -type d -path '*/protocol-core/cli')
          if [ ${#clis[@]} -ne 1 ]; then
            echo "::error::expected exactly 1 staged CLI dir, found ${#clis[@]}: ${clis[*]:-<none>}"
            exit 1
          fi
          cli="${clis[0]}"
          # JEP 483 landed in JDK 24, so on this runner the cache MUST have been produced. If it was
          # not, the task fell back silently and we would lose the speedup without noticing.
          [ -f "$cli/pstatus.aot" ] || { echo "::error::no AOT cache staged — JEP 483 expected on JDK 24"; exit 1; }
          # Exactly one line, and it must be the gate JSON: proves no AOT/CDS diagnostics leaked.
          out="$("$cli/pstatus" show)"
          echo "staged pstatus -> $out"
          [ "$(printf '%s' "$out" | wc -l | tr -d ' ')" = "0" ] \
            || { echo "::error::staged CLI wrote more than one stdout line — AOT diagnostics leaked into the JSON contract"; exit 1; }
          echo "$out" | grep -q '"metadataPrivate":false' \
            && echo "$out" | grep -q 'DEV, NO METADATA PRIVACY' \
            || { echo "::error::staged CLI stdout is not the expected labeling JSON"; exit 1; }
          # The fallback path must be correct too: with the cache removed the launcher still has to
          # emit the same single clean line (this is what -Xlog:disable buys us).
          mv "$cli/pstatus.aot" "$cli/pstatus.aot.off"
          fb="$("$cli/pstatus" show)"
          [ "$fb" = "$out" ] \
            || { echo "::error::fallback (no cache) stdout differs from cached stdout: [$fb]"; exit 1; }
          mv "$cli/pstatus.aot.off" "$cli/pstatus.aot"
          echo "AOT cache verified: cached and fallback stdout identical, single clean JSON line."

  lint:
    name: Lint — scalafmt (Scala formatting)
    runs-on: ubuntu-latest
    env:
      # Pinned (Constitution XI) and used in both the cache key and the download URL.
      CS_VERSION: 2.1.25-M26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "24"
      # The Coursier launcher comes from GitHub releases, the flakiest hop in this workflow: it failed
      # three times in one evening with `socket hang up`, red-flagging PRs whose code was fine. Cache
      # the binary so a healthy run touches that host ZERO times, and retry when a cache miss forces
      # it. `--retry-all-errors` matters — plain `--retry` ignores connection-level failures, which is
      # exactly what we saw. Keyed by launcher version, so bumping it re-downloads once.
      - name: Cache the Coursier launcher + scalafmt artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deppis-bin
            ~/.cache/coursier
          key: scalafmt-cs${{ env.CS_VERSION }}-${{ runner.os }}-${{ hashFiles('.scalafmt.conf') }}
          restore-keys: scalafmt-cs${{ env.CS_VERSION }}-${{ runner.os }}-
      - name: Install the Coursier launcher (cached)
        run: |
          mkdir -p ~/.cache/deppis-bin
          if [ ! -x ~/.cache/deppis-bin/cs ]; then
            curl -sSfL --retry 6 --retry-all-errors --retry-delay 5 \
              "https://github.com/coursier/coursier/releases/download/v${CS_VERSION}/cs-x86_64-pc-linux.gz" \
              | gzip -d > ~/.cache/deppis-bin/cs
            chmod +x ~/.cache/deppis-bin/cs
          fi
          echo "$HOME/.cache/deppis-bin" >> "$GITHUB_PATH"
      # Read the version from .scalafmt.conf rather than repeating it here. The old `apps:
      # scalafmt:3.8.3` claimed in a comment to track that file but could not: when Scala Steward
      # moved .scalafmt.conf to 3.8.6 (#106) this pin stayed at 3.8.3, so the gate silently ran a
      # different formatter than the repo declares. Derived, it cannot drift again.
      - name: Check Scala formatting (scalafmt --test)
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' .scalafmt.conf)"
          [ -n "$ver" ] || { echo "::error::could not read the version field from .scalafmt.conf"; exit 1; }
          echo "scalafmt $ver (from .scalafmt.conf)"
          cs launch "scalafmt:$ver" -- --test

  rust:
    name: Rust — fmt + clippy + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oblivious-sidecar
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc (tonic-build)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oblivious-sidecar
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  integration:
    name: Cross-process integration (Scala client ↔ Rust obsd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install libsodium + protoc
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev protobuf-compiler
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "24"
      - uses: sbt/setup-sbt@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oblivious-sidecar
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', 'project/V.scala') }}
          restore-keys: sbt-${{ runner.os }}-
      - name: Build obsd (the Rust sidecar binary)
        run: cargo build --bin obsd --manifest-path oblivious-sidecar/Cargo.toml
      - name: Run the cross-process integration test (Scala fronts ↔ obsd)
        run: OBSD_BIN="$(pwd)/oblivious-sidecar/target/debug/obsd" sbt -batch -no-colors "transport/testOnly transport.SidecarIntegrationSpec"

  scalajs:
    name: Scala.js engine — cross-build + link (T019)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "24"
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v7
        with:
          node-version: "22" # Scala.js tests run under Node
      - name: Install the vetted JS crypto dep (@noble/hashes, pinned)
        run: npm ci
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', 'project/V.scala') }}
          restore-keys: sbt-${{ runner.os }}-
      - name: Test the JS engine under Node + link the production bundle (one sbt session)
        # `;`-chained so the cross-platform KAT test and the @JSExportTopLevel link share one cold start.
        run: sbt -batch -no-colors ';protocolCoreJS/test ;protocolCoreJS/fullLinkJS'
      - name: E2E — drive the linked bundle through the engine-api contract (as a consumer loads it)
        # sbt 2.0 centralizes build outputs under target/out/<platform>/… (was protocol-core-js/target/…).
        # The Scala version is part of that path, so RESOLVE it rather than pinning it here — pinning
        # meant a `scalaVersion` bump in build.sbt silently needed a matching edit in this file.
        # Fail loudly unless the glob finds exactly one bundle, so a miss can never pass as green.
        run: |
          shopt -s nullglob
          bundles=(target/out/sjs1/scala-*/protocol-core-js/protocol-core-js-opt/main.js)
          if [ ${#bundles[@]} -ne 1 ]; then
            echo "::error::expected exactly 1 linked bundle, found ${#bundles[@]}: ${bundles[*]:-<none>}"
            exit 1
          fi
          echo "bundle: ${bundles[0]}"
          node protocol-core/js/e2e/engine-contract.cjs "${bundles[0]}"

  flutter:
    name: Flutter — analyze + widget tests (T005)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  hygiene:
    name: Hygiene — pinned deps + secret scan (T007)
    runs-on: ubuntu-latest
    env:
      # Pinned (Constitution XI) and used in both the cache key and the download URL.
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pinned dependencies (reproducible builds, Constitution XI)
        run: |
          grep -q '^sbt.version=' project/build.properties || { echo "::error::sbt.version must be pinned"; exit 1; }
          test -f oblivious-sidecar/Cargo.lock || { echo "::error::Cargo.lock must be committed"; exit 1; }
          test -f package-lock.json || { echo "::error::package-lock.json must be committed (pinned JS deps)"; exit 1; }
          echo "pinned-deps OK"
      # Same GitHub-releases flakiness as the lint job: this download failed twice in one evening
      # (`503`, then `curl: (56) Connection died`), failing the secret scan for network reasons. A
      # security gate that goes red on a CDN hiccup trains people to ignore it, so cache the binary
      # and retry on a miss. `--retry-all-errors` covers the connection-level failure `--retry` alone
      # would let through. The scan itself is unchanged.
      - name: Cache gitleaks
        uses: actions/cache@v6
        with:
          path: ~/.cache/deppis-bin
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ runner.os }}
      - name: Secret scan (gitleaks)
        run: |
          mkdir -p ~/.cache/deppis-bin
          if [ ! -x ~/.cache/deppis-bin/gitleaks ]; then
            curl -sSfL --retry 6 --retry-all-errors --retry-delay 5 \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | tar -xz -C ~/.cache/deppis-bin gitleaks
          fi
          ~/.cache/deppis-bin/gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner
