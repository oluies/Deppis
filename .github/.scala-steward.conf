# INTENTIONALLY EMPTY — do not add rules here. They will not run.
#
# Scala Steward's repo-specific config is the root `.scala-steward.conf`. THAT is the file to edit;
# every rule that used to live here has been moved into it.
#
# This file is kept, rather than deleted, only because scala-steward-action@v2 declares
# `.github/.scala-steward.conf` as the DEFAULT value of its `repo-config` input — the workflow does
# not pass the input, so it falls back to this path — and the action documents that it fails when a
# specified repo-config file is absent. Keeping it empty is the safe option.
#
# EVIDENCE THAT RULES HERE DO NOT TAKE EFFECT. This file landed 2026-08-12 (ec03b6a, PR #107)
# carrying an `updates.pin` for org.scala-lang at prefix "3.3." and a `pullRequests.grouping` rule
# for org.bouncycastle. Both were verified correct against Steward's own source — a group-only
# pattern does match every artifact in the group, since UpdatePattern.findMatch uses
# `artifactId.forall`. Yet weeks later:
#
#   - PR #135 (2026-09-07) proposed scalaVersion 3.3.8 -> 3.9.0, which the pin should have blocked.
#   - PR #137 (2026-09-14) was titled "Update bcpkix-jdk18on, bcprov-jdk18on, ... to 1.86" —
#     Steward's default multi-artifact title — not the `title` the grouping rule configured.
#
# Two independent rules, neither applied. The previous header here claimed "the workflow points its
# `repo-config` input here"; that claim was false and is what let the split go unnoticed.
