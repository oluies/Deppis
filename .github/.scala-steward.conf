# Scala Steward repo config. The workflow (.github/workflows/scala-steward.yml) points its
# `repo-config` input here; until this file existed, every rule below had to be enforced by hand
# on each weekly run.

# Scala stays on the 3.3.x LTS line. build.sbt says so in a comment ("the Next line is 3.8.x — stay
# on LTS"), but a comment cannot stop Steward: it proposed 3.3.8 -> 3.8.4 and would have re-proposed
# it every Monday forever. The trailing dot makes this a version PREFIX match, so LTS patch releases
# (3.3.9, 3.3.10, ...) still come through — only the jump off the LTS line is blocked.
updates.pin = [
  { groupId = "org.scala-lang", version = "3.3." }
]

# bcprov and bcpkix share one V.bouncycastle key, so they MUST move together. They do not version in
# lockstep upstream — bcprov ships patch releases that bcpkix does not (1.85.2 exists for bcprov, but
# bcpkix stops at 1.85) — so ungrouped, Steward opened two conflicting PRs and the bcprov-only one
# was unbuildable: it set V.bouncycastle = 1.85.2, which bcpkix cannot resolve. Grouping forces one
# PR at a version both artifacts actually publish.
pullRequests.grouping = [
  { name = "bouncycastle", title = "build(deps): BouncyCastle updates", filter = [{ group = "org.bouncycastle" }] }
]
